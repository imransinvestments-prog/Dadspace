name: Dadspace workers (twice daily, UK time)
# Timer runs are named so the slot ledger and Operations count them as scheduled slots.
run-name: ${{ inputs.timer_slot && format('Dadspace workers timer slot {0}', inputs.timer_slot) || github.workflow }}

on:
  # Twice-daily evidence collection for #65; timezone handles GMT/BST. Since Oct 2026 the
  # Supabase timer (#124) dispatches each slot on time; this schedule is the late backup.
  schedule:
    - cron: "17 7,19 * * *"
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      timer_slot:
        description: "Set by the Supabase timer: the Europe/London slot it is running (leave blank for a manual run)"
        default: ""

concurrency:
  group: dadspace-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.uk_time.outputs.should_run }}
    steps:
      - id: uk_time
        name: Start scheduled or manual worker run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          should_run=true
          # GitHub's schedule arrives hours late; once the timer has run this slot, the late
          # scheduled run is a duplicate. Slots are 12 hours apart, so 10 hours covers one slot.
          # If the check itself fails, run anyway: a duplicate is safer than a missed slot.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since=$(date -u -d '10 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            timer_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-workers.yml/runs?event=workflow_dispatch&created=>=$since&per_page=20" \
              --jq '[.workflow_runs[] | select(.display_title | contains("timer slot"))] | length') || timer_runs=0
            if [ "${timer_runs:-0}" -gt 0 ]; then
              should_run=false
              echo "The timer already ran a slot since $since; skipping this late scheduled duplicate."
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  news:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/news.yml
    with:
      dry_run: "false"
    secrets: inherit

  # Venue-reference data is enrichment, not a dependency of event collection.
  # A reference-source outage must not stop civic/activity/deals pipelines.
  venue_reference:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/venue-reference.yml
    with:
      dry_run: "false"
      limit: "0"
    secrets: inherit

  civic:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/collect-civic.yml
    with:
      dry_run: "false"
      limit: "0"
    secrets: inherit

  activities:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/collect-activities.yml
    with:
      dry_run: "false"
      limit: "0"
    secrets: inherit

  deals:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/deals_collect.yml
    with:
      dry_run: "false"
      self_test: "false"
      sample_size: "40"
    secrets: inherit

  # Expected-slot evidence for #124/#125: dispatch delay, completion and missed slots
  # for every scheduled workflow, recorded on each run whatever the feeds' outcome.
  # Diagnostic only: it must never turn a good feed run into a failed one.
  schedule_ledger:
    needs: [news, venue_reference, civic, activities, deals]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record scheduled slot ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/schedule-ledger.py --days 7 --json schedule-ledger.json | tee ledger.txt
          { echo '### Scheduled slot ledger (7 days, Europe/London)'; echo '```'; cat ledger.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-ledger
          path: schedule-ledger.json
          retention-days: 30

