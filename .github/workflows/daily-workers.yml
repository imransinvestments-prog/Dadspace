name: Dadspace workers (twice daily, UK time)

on:
  # Twice-daily evidence collection for #65; timezone handles GMT/BST.
  schedule:
    - cron: "17 7,19 * * *"
      timezone: Europe/London
  workflow_dispatch:

concurrency:
  group: dadspace-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.uk_time.outputs.should_run }}
    steps:
      - id: uk_time
        name: Start scheduled or manual worker run
        shell: bash
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

  news:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/news.yml
    with:
      dry_run: "false"
    secrets: inherit

  # Venue-reference data is enrichment, not a dependency of event collection.
  # A reference-source outage must not stop civic/activity/deals pipelines.
  venue_reference:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/venue-reference.yml
    with:
      dry_run: "false"
      limit: "0"
    secrets: inherit

  civic:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/collect-civic.yml
    with:
      dry_run: "false"
      limit: "0"
    secrets: inherit

  activities:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/collect-activities.yml
    with:
      dry_run: "false"
      limit: "0"
    secrets: inherit

  deals:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    uses: ./.github/workflows/deals_collect.yml
    with:
      dry_run: "false"
      self_test: "false"
      sample_size: "40"
    secrets: inherit

  # Expected-slot evidence for #124/#125: dispatch delay, completion and missed slots
  # for every scheduled workflow, recorded on each run whatever the feeds' outcome.
  # Diagnostic only: it must never turn a good feed run into a failed one.
  schedule_ledger:
    needs: [news, venue_reference, civic, activities, deals]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record scheduled slot ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/schedule-ledger.py --days 7 --json schedule-ledger.json | tee ledger.txt
          { echo '### Scheduled slot ledger (7 days, Europe/London)'; echo '```'; cat ledger.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-ledger
          path: schedule-ledger.json
          retention-days: 30

