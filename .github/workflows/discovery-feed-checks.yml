name: Discovery feed state checks
on:
  pull_request:
    # Shared schedule helpers are exercised even when no route/component changes.
    paths: ['lib/events.ts', 'lib/activities.ts', 'lib/activity-shared.ts', 'lib/activity-schedule.ts', 'lib/types.ts', 'lib/discovery-radius.ts', 'components/activities/**', 'components/events/**', 'components/discovery-radius-controls.tsx', 'components/event-card.tsx', 'app/api/events/**', 'app/api/activities/**', 'app/api/home/nearby-week/**', 'app/events/**', 'app/activities/**', 'tests/discovery-feed-states.test.cjs', 'tests/discovery-radius.test.cjs', 'tests/activity-schedule.test.cjs', 'hooks/use-directory-page.ts', 'tests/directory-page.test.cjs', '.github/workflows/discovery-feed-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/discovery-feed-states.test.cjs tests/discovery-radius.test.cjs tests/directory-page.test.cjs tests/activity-schedule.test.cjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
