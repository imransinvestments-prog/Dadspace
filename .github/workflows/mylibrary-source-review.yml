name: MyLibrary adapter review
on:
  pull_request:
    branches: [main]
    paths:
      - 'mylibrary_calendar.py'
      - 'library_portal.py'
      - 'events_worker.py'
      - 'activity_dates.py'
      - 'classforkids_calendar.py'
      - 'tests/test_classforkids_calendar.py'
      - 'tests/test_activity_dates.py'
      - 'tests/test_mylibrary_calendar.py'
      - 'tests/test_mylibrary_review_scope.py'
      - 'tests/test_library_portal.py'
      - 'tests/fixtures/mylibrary-*'
      - 'tests/fixtures/library-portal-*'
      - 'scripts/validate_mylibrary_sources.py'
      - 'scripts/validate_ds10_human_review.py'
      - 'tests/test_ds10_human_review.py'
      - '.github/workflows/mylibrary-source-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_activity_ingestion.py -v
      - run: python -m unittest discover -s tests -p test_activity_dates.py -v
      - run: python -m unittest discover -s tests -p test_classforkids_calendar.py -v
      - run: python -m unittest discover -s tests -p test_mylibrary_calendar.py -v
      - run: python -m unittest discover -s tests -p test_mylibrary_review_scope.py -v
      - run: python -m unittest discover -s tests -p test_library_portal.py -v
      - run: python -m unittest discover -s tests -p test_ds10_human_review.py -v
  live-read-only:
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-browser.txt
      - run: playwright install --with-deps chromium
      - name: Validate the affected adapter family without broad source qualification
        shell: bash
        run: |
          args=()
          if [ "$EVENT_NAME" = pull_request ] && git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- library_portal.py events_worker.py; then
            args+=(--family mylibrary_calendar)
          fi
          python scripts/validate_mylibrary_sources.py "${args[@]}"
        env:
          DRY_RUN: 'true'
          FETCH_ENGINE: browser
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mylibrary-source-review-${{ github.run_id }}
          path: mylibrary-source-review/
          if-no-files-found: error
          retention-days: 30
