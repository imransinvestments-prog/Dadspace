name: Deals collect

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (saves nothing, writes review files)"
        type: boolean
        default: true
      self_test:
        description: "Only check that everything is connected (no deals fetched)"
        type: boolean
        default: false
      sample_size:
        description: "Number of deals in the review sample"
        default: "40"
      keep_unknown_discount_low:
        description: "Keep low-value deals whose discount is unknown"
        type: boolean
        default: false
  # TURN THIS ON ONLY AFTER THE DRY RUN LOOKS GOOD (remove the # at the start of the next 2 lines).
  # Scheduled runs are LIVE runs and will save deals.
  # schedule:
  #   - cron: "0 7,13,19 * * *"   # 7am, 1pm and 7pm UTC

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run deals worker
        env:
          PYTHONUNBUFFERED: "1"
          # Scheduled runs are live; manual runs follow the tick-box above.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          SAMPLE_SIZE: ${{ inputs.sample_size || '40' }}
          KEEP_UNKNOWN_DISCOUNT_LOW: ${{ inputs.keep_unknown_discount_low || 'false' }}
          # The worker uses whichever of these secrets exist in your repo.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python deals_worker.py ${{ inputs.self_test && '--self-test' || '' }}

      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-dry-run-review
          path: review/
          if-no-files-found: ignore
          retention-days: 14
