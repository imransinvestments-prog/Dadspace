name: Deals collect

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (saves nothing, writes review files)"
        type: boolean
        default: false
      self_test:
        description: "Only check that everything is connected (no deals fetched)"
        type: boolean
        default: false
      sample_size:
        description: "Number of deals in the review sample"
        default: "40"
      keep_unknown_discount_low:
        description: "Keep low-value deals whose discount is unknown"
        type: boolean
        default: false

  # GitHub cron uses UTC. Trigger both GMT/BST equivalents and gate against
  # Europe/London so the worker runs at 07:00, 13:00 and 19:00 UK local time.
  schedule:
    - cron: "0 6,7,12,13,18,19 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: uk_time
        name: Check UK schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: continuing."
            exit 0
          fi

          UK_HOUR=$(TZ=Europe/London date +%H)
          UK_TIME=$(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')
          echo "Current UK time: $UK_TIME"

          case "$UK_HOUR" in
            07|13|19)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled UK deals run: continuing."
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Duplicate UTC trigger: skipping."
              ;;
          esac

      - uses: actions/checkout@v4
        if: steps.uk_time.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.uk_time.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - run: pip install requests
        if: steps.uk_time.outputs.should_run == 'true'

      - name: Run deals worker
        if: steps.uk_time.outputs.should_run == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          # Scheduled runs are always live. Manual runs use the checkbox above.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          SAMPLE_SIZE: ${{ inputs.sample_size || '40' }}
          KEEP_UNKNOWN_DISCOUNT_LOW: ${{ inputs.keep_unknown_discount_low || 'false' }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          # Optional source credentials. Sources remain independently controlled
          # by deal_sources.active, so missing credentials do not affect RSS.
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          FMTC_API_TOKEN: ${{ secrets.FMTC_API_TOKEN }}
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}

        run: python deals_worker_db.py ${{ inputs.self_test && '--self-test' || '' }}

      - name: Upload review files
        if: always() && steps.uk_time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deals-dry-run-review
          path: review/
          if-no-files-found: ignore
          retention-days: 14
