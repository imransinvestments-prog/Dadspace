name: Dadspace deals

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only show results and review files, false = save to Supabase"
        default: "true"
      self_test:
        description: "true = only check connections/configuration"
        default: "false"
      sample_size:
        description: "Number of deals in the review sample"
        default: "40"


  workflow_call:
    inputs:
      dry_run:
        description: "true = only show results and review files, false = save to Supabase"
        required: false
        type: string
        default: "false"
      self_test:
        description: "true = only check connections/configuration"
        required: false
        type: string
        default: "false"
      sample_size:
        description: "Number of deals in the review sample"
        required: false
        type: string
        default: "40"


permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Validate Python (syntax check)
        run: python -m py_compile deals_worker.py deals_worker_db.py deals_source_adapters.py deals_quality.py deals_verification.py

      - name: Deals regression checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Self-test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          FMTC_API_TOKEN: ${{ secrets.FMTC_API_TOKEN }}
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: python deals_worker_db.py --self-test

      - name: Run deals worker
        if: ${{ (inputs.self_test || 'false') != 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          SAMPLE_SIZE: ${{ inputs.sample_size || '40' }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          FMTC_API_TOKEN: ${{ secrets.FMTC_API_TOKEN }}
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}
        run: python deals_worker_db.py

      - name: Upload review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-review-${{ github.run_id }}
          path: review/
          if-no-files-found: ignore
          retention-days: 14

