name: Deals collect (every 2 days)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (saves nothing, writes review files)"
        type: boolean
        default: false
      self_test:
        description: "Only check that everything is connected (no deals fetched)"
        type: boolean
        default: false
      sample_size:
        description: "Number of deals in the review sample"
        default: "40"
      keep_unknown_discount_low:
        description: "Keep low-value deals whose discount is unknown"
        type: boolean
        default: false

  # Trigger both UTC equivalents of 07:00 UK time daily, then gate to every
  # second calendar day from 2026-10-01. Manual runs bypass the cadence.
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: uk_time
        name: Check UK time and two-day cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: continuing."
            exit 0
          fi

          UK_HOUR=$(TZ=Europe/London date +%H)
          UK_DATE=$(TZ=Europe/London date +%F)
          UK_TIME=$(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')
          echo "Current UK time: $UK_TIME"

          if [ "$UK_HOUR" != "07" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not 07:00 in Europe/London: skipping duplicate UTC trigger."
            exit 0
          fi

          ANCHOR_EPOCH=$(date -u -d '2026-10-01' +%s)
          TODAY_EPOCH=$(date -u -d "$UK_DATE" +%s)
          DAYS_SINCE=$(( (TODAY_EPOCH - ANCHOR_EPOCH) / 86400 ))

          if [ $(( DAYS_SINCE % 2 )) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Every-two-days cadence matched: running deals worker."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Off day in every-two-days cadence: skipping deals worker."
          fi

      - uses: actions/checkout@v4
        if: steps.uk_time.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.uk_time.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - run: pip install requests
        if: steps.uk_time.outputs.should_run == 'true'

      - name: Run deals worker
        if: steps.uk_time.outputs.should_run == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          SAMPLE_SIZE: ${{ inputs.sample_size || '40' }}
          KEEP_UNKNOWN_DISCOUNT_LOW: ${{ inputs.keep_unknown_discount_low || 'false' }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          FMTC_API_TOKEN: ${{ secrets.FMTC_API_TOKEN }}
          PEPPER_API_KEY: ${{ secrets.PEPPER_API_KEY }}

        run: python deals_worker_db.py ${{ inputs.self_test && '--self-test' || '' }}

      - name: Upload review files
        if: always() && steps.uk_time.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deals-dry-run-review
          path: review/
          if-no-files-found: ignore
          retention-days: 14
