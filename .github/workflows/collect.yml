name: Collect events

on:
  schedule:
    - cron: "0 5 * * 1"        # every Monday at 05:00 UTC
  workflow_dispatch:            # lets you press a "Run workflow" button
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        default: "5"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        default: "true"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
