name: Dadspace original content
# Timer runs are named so the slot ledger and Operations count them as scheduled slots.
run-name: Originals ${{ github.event_name }} ${{ inputs.maintenance_request || '' }}${{ inputs.timer_slot && format('timer slot {0}', inputs.timer_slot) || '' }}
on:
  schedule:
    - cron: '17 7,9 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate content without publishing
        type: boolean
        default: true
      cadence:
        description: Optional single cadence for a bounded maintenance retry
        type: choice
        options: [all, daily, weekly]
        default: all
      slot_date:
        description: Optional current London date (YYYY-MM-DD); older slots cannot be regenerated
        default: ''
      maintenance_request:
        description: Optional Operations audit request UUID
        default: ''
      # A late GitHub-scheduled duplicate is harmless here: the worker skips a slot already published.
      timer_slot:
        description: Set by the Supabase timer (#124); leave blank for a manual run
        default: ''
  push:
    branches: [main]
    paths: ['original_content_worker.py', 'scripts/maintenance-run.py', '.github/workflows/original-content.yml']
  pull_request:
    paths: ['app/originals/**', 'lib/originals.ts', 'original_content_worker.py', 'scripts/maintenance-run.py', 'tests/test_original_content.py', 'tests/test_maintenance_run.py', '.github/workflows/original-content.yml']
permissions:
  contents: read
concurrency:
  group: original-content
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_original_content.py -v
      - run: python -m unittest discover -s tests -p test_maintenance_run.py -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  publish:
    needs: checks
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate maintenance claim
        run: python scripts/maintenance-run.py start originals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAINTENANCE_REQUEST: ${{ inputs.maintenance_request }}
          MAINTENANCE_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          MAINTENANCE_CADENCE: ${{ inputs.cadence }}
          MAINTENANCE_SLOT_DATE: ${{ inputs.slot_date }}
      - name: Generate, review and publish due originals
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ -n "$CADENCE" ] && [ "$CADENCE" != all ]; then args+=(--cadence "$CADENCE"); fi
          if [ -n "$SLOT_DATE" ]; then args+=(--slot-date "$SLOT_DATE"); fi
          python original_content_worker.py "${args[@]}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ORIGINAL_CONTENT_RETAIN_EVIDENCE: 'true'
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          CADENCE: ${{ inputs.cadence }}
          SLOT_DATE: ${{ inputs.slot_date }}
      - name: Reconcile maintenance result
        if: always()
        run: python scripts/maintenance-run.py finish originals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAINTENANCE_REQUEST: ${{ inputs.maintenance_request }}
          MAINTENANCE_RESULT: ${{ job.status }}
