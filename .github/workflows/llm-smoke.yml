name: LLM provider smoke (manual, one request)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider with a funded Actions secret
        type: choice
        options: [openai, gemini, deepseek]
        default: openai
      model:
        description: API model ID compatible with structured output
        type: string
        required: true
        default: gpt-4.1-mini
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-llm.txt
      - name: Fixed fixture, no database access
        run: python scripts/llm_smoke.py
        env:
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_MODEL: ${{ inputs.model }}
          LLM_RUN_MAX_ATTEMPTS: '1'
          LLM_MAX_RETRIES: '0'
          LLM_MAX_OUTPUT_TOKENS: '1000'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-smoke
          path: llm-smoke.json
          if-no-files-found: ignore
