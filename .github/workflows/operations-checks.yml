name: Operations dashboard checks
on:
  pull_request:
    paths: ['app/ops/**', 'lib/operations/**', 'lib/auth/redirect.ts', 'app/robots.ts', 'tests/operations.test.cjs', '.github/workflows/operations-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/operations.test.cjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
