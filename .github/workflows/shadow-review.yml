name: Extraction shadow comparison
on:
  workflow_run:
    workflows:
      - Dadspace workers (twice daily, UK time)
      - Collect events (councils, heritage & niche venues)
      - Collect events (activities & clubs)
    types: [completed]
  pull_request:
    paths: ['shadow_capture.py', 'llm_provider.py', 'scripts/replay_shadow.py', 'tests/test_shadow_review.py', 'tests/test_llm_provider.py', '.github/workflows/shadow-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pydantic
      - run: python -m unittest discover -s tests -p test_shadow_review.py -v
      - run: python -m unittest discover -s tests -p test_llm_provider.py -v
  compare:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - uses: actions/download-artifact@v5
        with:
          pattern: gemini-shadow-input-*
          path: shadow-input
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay captured prompts only
        run: python scripts/replay_shadow.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTRACTION_LLM_PROVIDER: openai
          EXTRACTION_LLM_MODEL: gpt-4.1-mini
          LLM_RUN_MAX_ATTEMPTS: '4'
          LLM_RUN_TOKEN_BUDGET: '60000'
          LLM_MAX_OUTPUT_TOKENS: '3000'
          LLM_MAX_RETRIES: '0'
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          BASELINE_INPUT_USD_PER_MILLION: ${{ vars.SHADOW_GEMINI_INPUT_USD_PER_MILLION }}
          BASELINE_OUTPUT_USD_PER_MILLION: ${{ vars.SHADOW_GEMINI_OUTPUT_USD_PER_MILLION }}
          SHADOW_INPUT_USD_PER_MILLION: ${{ vars.SHADOW_OPENAI_INPUT_USD_PER_MILLION }}
          SHADOW_OUTPUT_USD_PER_MILLION: ${{ vars.SHADOW_OPENAI_OUTPUT_USD_PER_MILLION }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-comparison-${{ github.event.workflow_run.id }}
          path: shadow-results/
          retention-days: 14
          if-no-files-found: warn
