name: Extraction shadow comparison
on:
  workflow_dispatch:
    inputs:
      reviewed_cohort:
        description: Reviewed directory under artefacts/shadow-cohorts (paid, existing caps)
        required: true
        type: string
  workflow_run:
    workflows:
      - Dadspace workers (twice daily, UK time)
      - Collect events (councils, heritage & niche venues)
      - Collect events (activities & clubs)
    types: [completed]
  pull_request:
    paths: ['shadow_capture.py', 'llm_provider.py', 'scripts/*shadow*.py', 'tests/test_shadow*.py', 'tests/test_llm_provider.py', 'artefacts/shadow-cohorts/**', '.github/workflows/shadow-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pydantic requests beautifulsoup4
      - run: python -m unittest discover -s tests -p test_shadow_review.py -v
      - run: python -m unittest discover -s tests -p test_rebuild_shadow_captures.py -v
      - run: python -m unittest discover -s tests -p test_shadow_chunks.py -v
      - run: python -m unittest discover -s tests -p test_llm_provider.py -v
  compare:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: openai-non-reasoning
            provider: openai
            model: gpt-4.1-mini
            input_rate: SHADOW_OPENAI_INPUT_USD_PER_MILLION
            output_rate: SHADOW_OPENAI_OUTPUT_USD_PER_MILLION
          - variant: gemini-minimum-thinking
            provider: gemini
            model: gemini-3.6-flash
            input_rate: SHADOW_GEMINI_INPUT_USD_PER_MILLION
            output_rate: SHADOW_GEMINI_OUTPUT_USD_PER_MILLION
          # Provider comparison arms (#145, owner-approved 23 Oct 2026). They run only on a manual
          # reviewed-cohort dispatch, never on the automatic shadow, so they add no daily spend.
          # Set the *_MODEL repo variable to override a model without a code change.
          - variant: gemini-production
            provider: gemini
            model: gemini-3.6-flash
            dispatch_only: true
            input_rate: SHADOW_GEMINI_INPUT_USD_PER_MILLION
            output_rate: SHADOW_GEMINI_OUTPUT_USD_PER_MILLION
          - variant: claude-haiku
            provider: anthropic
            model: claude-haiku-5-5
            model_var: SHADOW_ANTHROPIC_MODEL
            dispatch_only: true
            input_rate: SHADOW_ANTHROPIC_INPUT_USD_PER_MILLION
            output_rate: SHADOW_ANTHROPIC_OUTPUT_USD_PER_MILLION
          - variant: deepseek
            provider: deepseek
            model: deepseek-chat
            model_var: SHADOW_DEEPSEEK_MODEL
            dispatch_only: true
            input_rate: SHADOW_DEEPSEEK_INPUT_USD_PER_MILLION
            output_rate: SHADOW_DEEPSEEK_OUTPUT_USD_PER_MILLION
          - variant: openrouter-free
            provider: openrouter
            model: ''  # required: set SHADOW_OPENROUTER_MODEL (a free model id) before dispatch
            model_var: SHADOW_OPENROUTER_MODEL
            dispatch_only: true
            input_rate: SHADOW_OPENROUTER_INPUT_USD_PER_MILLION
            output_rate: SHADOW_OPENROUTER_OUTPUT_USD_PER_MILLION
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema ${{ matrix.provider == 'anthropic' && 'anthropic' || '' }}
      - uses: actions/download-artifact@v5
        if: github.event_name == 'workflow_run'
        with:
          pattern: gemini-shadow-input-*
          path: shadow-input
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay captured prompts only
        if: matrix.dispatch_only != true || github.event_name == 'workflow_dispatch'
        run: python scripts/replay_shadow.py
        env:
          OPENAI_API_KEY: ${{ matrix.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ matrix.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ matrix.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          EXTRACTION_LLM_PROVIDER: ${{ matrix.provider }}
          EXTRACTION_LLM_MODEL: ${{ matrix.model_var && vars[matrix.model_var] || matrix.model }}
          # The production arm uses production's thinking setting; other Gemini arms set their own.
          GEMINI_THINKING_LEVEL: ${{ matrix.variant == 'gemini-production' && vars.GEMINI_EXTRACTION_THINKING_LEVEL || '' }}
          SHADOW_VARIANT: ${{ matrix.variant }}
          SHADOW_REVIEWED_COHORT: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed_cohort || '' }}
          LLM_RUN_MAX_ATTEMPTS: '4'
          LLM_RUN_TOKEN_BUDGET: '60000'
          LLM_MAX_OUTPUT_TOKENS: '3000'
          LLM_MAX_RETRIES: '0'
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          BASELINE_INPUT_USD_PER_MILLION: ${{ vars.SHADOW_GEMINI_INPUT_USD_PER_MILLION }}
          BASELINE_OUTPUT_USD_PER_MILLION: ${{ vars.SHADOW_GEMINI_OUTPUT_USD_PER_MILLION }}
          SHADOW_INPUT_USD_PER_MILLION: ${{ vars[matrix.input_rate] }}
          SHADOW_OUTPUT_USD_PER_MILLION: ${{ vars[matrix.output_rate] }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-comparison-${{ matrix.variant }}-${{ github.event.workflow_run.id || github.run_id }}
          path: shadow-results/
          retention-days: 14
          if-no-files-found: warn
