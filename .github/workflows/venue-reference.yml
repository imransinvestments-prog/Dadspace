name: Sync venue reference data

on:
  push:
    branches: [main]
    paths:
      - "venue_reference_loader_v2.py"
      - "venue_council_discovery.py"
      - "venue_country.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = reconcile/report only, false = write matches/new hidden venues"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      limit:
        description: "Maximum records to process (0 = all)"
        required: false
        default: "0"
      council:
        description: "Council discovery for one ONS code only (e.g. E09000009); blank runs the normal loader"
        required: false
        default: ""
      councils_per_run:
        description: "Council discovery: councils per run"
        required: false
        default: "10"
      council_llm:
        description: "Council discovery: draft unverified descriptions and busy times with the LLM"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: string
        default: "true"
      limit:
        required: false
        type: string
        default: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt jsonschema
      - name: Syntax check
        run: python -m py_compile venue_reference_loader_v2.py venue_council_discovery.py
      - name: Reconcile venue reference datasets
        if: ${{ !inputs.council }}
        run: python venue_reference_loader_v2.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run || 'true' }}
          LIMIT: ${{ inputs.limit || '0' }}
          COUNCILS_PER_RUN: ${{ inputs.councils_per_run || vars.COUNCIL_DISCOVERY_PER_RUN || '10' }}
          # Push-triggered dry runs never spend LLM budget.
          COUNCIL_DISCOVERY_LLM: ${{ github.event_name == 'push' && 'false' || inputs.council_llm || 'true' }}
          COUNCIL_DISCOVERY_MAX_LLM_CALLS: ${{ vars.COUNCIL_DISCOVERY_MAX_LLM_CALLS || '0' }}
          VENUE_DISCOVERY_LLM_PROVIDER: ${{ vars.VENUE_DISCOVERY_LLM_PROVIDER }}
          VENUE_DISCOVERY_LLM_MODEL: ${{ vars.VENUE_DISCOVERY_LLM_MODEL }}
          LLM_RUN_TOKEN_BUDGET: ${{ vars.COUNCIL_DISCOVERY_TOKEN_BUDGET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OVERPASS_URL: ${{ vars.OVERPASS_URL || 'https://overpass-api.de/api/interpreter' }}
      - name: Council discovery for one council
        if: ${{ inputs.council }}
        run: python venue_council_discovery.py --council "$COUNCIL"
        env:
          COUNCIL: ${{ inputs.council }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          COUNCIL_DISCOVERY_LLM: ${{ inputs.council_llm || 'true' }}
          COUNCIL_DISCOVERY_MAX_LLM_CALLS: ${{ vars.COUNCIL_DISCOVERY_MAX_LLM_CALLS || '0' }}
          VENUE_DISCOVERY_LLM_PROVIDER: ${{ vars.VENUE_DISCOVERY_LLM_PROVIDER }}
          VENUE_DISCOVERY_LLM_MODEL: ${{ vars.VENUE_DISCOVERY_LLM_MODEL }}
          LLM_RUN_TOKEN_BUDGET: ${{ vars.COUNCIL_DISCOVERY_TOKEN_BUDGET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OVERPASS_URL: ${{ vars.OVERPASS_URL || 'https://overpass-api.de/api/interpreter' }}
      - name: Upload council discovery JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-discovery-${{ github.run_id }}
          path: review/council-discovery/*.json
          if-no-files-found: ignore
