name: Collect events (activities & clubs)

# The "trickier" track: activity aggregators and franchise/club listing sites.
# Several of these build their event lists with JavaScript, so this uses a real
# (invisible) browser to load the page first. Slower, and kept separate so a
# problem here never stops the civic/heritage run above.

on:
  schedule:
    - cron: "0 6 * * 1"        # every Monday at 06:00 UTC (an hour after the civic run)
  workflow_dispatch:
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        default: "5"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        default: "true"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-browser.txt
      - run: playwright install --with-deps chromium
      - name: Validate Python (syntax check)
        run: python -m py_compile worker.py
      - name: Self-test (no network/Gemini/Supabase calls)
        run: python worker.py --self-test
      - name: Run collector
        run: python worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CATEGORIES: "activities"
          FETCH_ENGINE: "browser"
          # Browser pages only need DOMContentLoaded plus a short JS settle; do not wait for networkidle.
          BROWSER_GOTO_TIMEOUT_MS: "30000"
          BROWSER_SETTLE_MS: "2500"
          # Browser pages are expensive to send to Gemini. Compact event rows are
          # placed first by worker.py, so this smaller cap preserves useful listings
          # while cutting the maximum prompt payload by 40% (40k -> 24k chars).
          MAX_CHARS: "24000"
          # Do not pay for Gemini when a rendered page contains no date-like signal.
          # clean_events requires a real date anyway, so such a call cannot save an event.
          MIN_DATE_HINTS_FOR_LLM: "1"
          # DOWTK's homepage is an attraction/location search portal, not a dated
          # event listing. Keep it out of this event collector until/unless a
          # dedicated search adapter with bounded locations is intentionally added.
          BROWSER_SKIP_SOURCE_NAMES: "Day Out With The Kids"
          MAX_RUN_MINUTES: "60"
          GEMINI_TIMEOUT_SECONDS: "90"
          LIMIT: ${{ inputs.limit || '0' }}
          # Scheduled (automatic) runs have no inputs, so this default is what they use.
          # 'true' = report only, save nothing. Change to 'false' when you are ready to go live.
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
