name: Collect events (activities & clubs)

# Browser-based activity collector. Kept separate from civic so browser failures
# do not affect the requests-based collector.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        default: "5"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        default: "true"
      force_reread:
        description: "true = ignore saved page hashes and fully re-read sources"
        default: "false"
  workflow_call:
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        required: false
        type: string
        default: "0"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        required: false
        type: string
        default: "true"
      force_reread:
        description: "true = ignore saved page hashes and fully re-read sources"
        required: false
        type: string
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-browser.txt
      - run: playwright install --with-deps chromium
      - name: Validate Python (syntax check)
        run: python -m py_compile worker.py events_worker.py scripts/export_events_backup.py
      - name: Self-test (no network/Gemini/Supabase calls)
        run: python events_worker.py --self-test
      - name: Back up events before any live write
        if: ${{ (inputs.dry_run || 'true') == 'false' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export_events_backup.py
      - name: Upload pre-write event backup
        if: ${{ (inputs.dry_run || 'true') == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: events-before-activities-write-${{ github.run_id }}
          path: event-backup/
          retention-days: 30
          if-no-files-found: error
      - name: Run collector
        run: python events_worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WORKER_NAME: "events-activities"
          CATEGORIES: "activities"
          FETCH_ENGINE: "browser"
          BROWSER_GOTO_TIMEOUT_MS: "30000"
          BROWSER_SETTLE_MS: "2500"
          MAX_CHARS: "24000"
          MIN_DATE_HINTS_FOR_LLM: "1"
          MAX_RUN_MINUTES: "60"
          GEMINI_TIMEOUT_SECONDS: "90"
          EXPIRED_RETENTION_DAYS: "730"
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          FORCE_REREAD: ${{ inputs.force_reread || 'false' }}
