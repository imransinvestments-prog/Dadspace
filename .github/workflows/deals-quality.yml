name: Deals quality checks

on:
  push:
    branches: ["codex/mvp-testing"]
    paths:
      - "deals_*.py"
      - "lib/deals*"
      - "app/deals/**"
      - "components/deal-card.tsx"
      - "components/home/home-deals.tsx"
      - "scripts/deals*"
      - "tests/**"
      - ".github/workflows/deals*"
  pull_request:
    paths:
      - "deals_*.py"
      - "tests/**"
      - "lib/**"
      - "components/**"
      - "app/deals/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deals-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - run: pip install requests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/deals-selection.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

