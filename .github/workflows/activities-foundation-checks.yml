name: Activities foundation checks
on:
  pull_request:
    paths:
      - 'worker.py'
      - 'collection_evidence.py'
      - 'mylibrary_calendar.py'
      - 'activity_eligibility.py'
      - 'scripts/replay-activity-identity.mjs'
      - 'scripts/build-activity-eligibility.py'
      - 'tests/activity-identity-replay.test.mjs'
      - 'tests/activity-renewal-transactions.test.mjs'
      - 'tests/test_collection_*.py'
      - 'tests/test_activity_renewal.py'
      - 'tests/test_activity_eligibility.py'
      - '.github/workflows/activities-foundation-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_collection_*.py' -v
      - run: python -m unittest discover -s tests -p test_activity_ingestion.py -v
      - run: python -m unittest discover -s tests -p test_activity_renewal.py -v
      - run: python -m unittest discover -s tests -p test_activity_eligibility.py -v
      - run: python -m unittest discover -s tests -p test_mylibrary_calendar.py -v
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/activity-identity-replay.test.mjs tests/activity-renewal-transactions.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
