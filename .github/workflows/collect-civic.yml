name: Collect events (councils, heritage & niche venues)

# The reliable track: councils, museums, heritage sites and niche venues.

on:
  pull_request:
    branches: [main]
    paths:
      - "events_worker.py"
      - "scripts/export_events_backup.py"
      - "scripts/audit_and_merge_event_duplicates.py"
      - ".github/workflows/collect-civic.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        default: "5"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        default: "true"
      force_reread:
        description: "true = ignore saved page hashes and fully re-read sources"
        default: "false"
  workflow_call:
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        required: false
        type: string
        default: "0"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        required: false
        type: string
        default: "true"
      force_reread:
        description: "true = ignore saved page hashes and fully re-read sources"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  review-safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Export current events (read only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export_events_backup.py
      - name: Build duplicate review plan (read only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/audit_and_merge_event_duplicates.py
      - name: Upload safety review artifact
        uses: actions/upload-artifact@v4
        with:
          name: events-quality-review-safety-${{ github.run_id }}
          path: |
            event-backup/
            duplicate-review/
          retention-days: 30
          if-no-files-found: error

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate Python (syntax check)
        run: python -m py_compile worker.py events_worker.py scripts/export_events_backup.py scripts/audit_and_merge_event_duplicates.py
      - name: Gemini usage control regressions (no network)
        run: python -m unittest discover -s tests -p test_gemini_usage.py -v
      - name: Self-test (no network/Gemini/Supabase calls)
        run: python events_worker.py --self-test
      - name: Back up events before any live write
        if: ${{ (inputs.dry_run || 'true') == 'false' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/export_events_backup.py
      - name: Upload pre-write event backup
        if: ${{ (inputs.dry_run || 'true') == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: events-before-civic-write-${{ github.run_id }}
          path: event-backup/
          retention-days: 30
          if-no-files-found: error
      - name: Run collector
        run: python events_worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Blank preserves model defaults until quality evaluation approves a setting.
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_EXTRACTION_THINKING_LEVEL }}
          GEMINI_RUN_TOKEN_BUDGET: ${{ vars.GEMINI_EXTRACTION_TOKEN_BUDGET }}
          GEMINI_RUN_MAX_ATTEMPTS: ${{ vars.GEMINI_EXTRACTION_MAX_ATTEMPTS }}
          GEMINI_MAX_OUTPUT_TOKENS: ${{ vars.GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS }}
          WORKER_NAME: "events-civic"
          CATEGORIES: "councils,heritage_parks,niche_venues"
          FETCH_ENGINE: "requests"
          MAX_RUN_MINUTES: "45"
          GEMINI_TIMEOUT_SECONDS: "60"
          EXPIRED_RETENTION_DAYS: "730"
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          FORCE_REREAD: ${{ inputs.force_reread || 'false' }}
