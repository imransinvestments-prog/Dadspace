name: Collect events (councils, heritage & niche venues)

# The "reliable" track: councils, museums, heritage sites and niche venues you add by hand.
# These are ordinary web pages, so this uses a plain, fast page download - no browser needed.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        default: "5"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        default: "true"
  workflow_call:
    inputs:
      limit:
        description: "How many websites to process (0 = all)"
        required: false
        type: string
        default: "0"
      dry_run:
        description: "true = only show what would be saved, false = save to Supabase"
        required: false
        type: string
        default: "true"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate Python (syntax check)
        run: python -m py_compile worker.py
      - name: Self-test (no network/Gemini/Supabase calls)
        run: python worker.py --self-test
      - name: Run collector
        run: python worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CATEGORIES: "councils,heritage_parks,niche_venues"
          FETCH_ENGINE: "requests"
          MAX_RUN_MINUTES: "45"
          GEMINI_TIMEOUT_SECONDS: "60"
          LIMIT: ${{ inputs.limit || '0' }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
