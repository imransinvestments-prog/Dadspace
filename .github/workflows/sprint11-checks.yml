name: Sprint 11 regression checks
on:
  pull_request:
    paths: ['app/ops/**', 'app/venues/**', 'app/places/**', 'components/app-shell.tsx', 'lib/**', 'tests/**', 'scripts/*sprint11*', 'run_context.py', 'worker.py', 'news_worker.py', 'deals_worker.py', '.github/workflows/sprint11-checks.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pip install -r requirements.txt feedparser jsonschema tzdata
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
