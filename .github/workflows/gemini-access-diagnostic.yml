name: Gemini access diagnostic (no generation)
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/diagnose_gemini_access.py', 'tests/test_gemini_access_diagnostic.py', '.github/workflows/gemini-access-diagnostic.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_gemini_access_diagnostic.py -v
  metadata:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-genai
      - run: python scripts/diagnose_gemini_access.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIAGNOSTIC_MODEL: gemini-3.6-flash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-access-diagnostic-${{ github.run_id }}
          path: gemini-access-diagnostic.json
          if-no-files-found: error
          retention-days: 14
