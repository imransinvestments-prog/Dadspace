name: Activity date route review
on:
  pull_request:
    branches: [main]
    paths:
      - 'activity_dates.py'
      - 'classforkids_calendar.py'
      - 'scripts/validate_activity_date_routes.py'
      - 'tests/test_activity_dates.py'
      - 'tests/test_classforkids_calendar.py'
      - '.github/workflows/activity-date-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_activity_dates.py -v
      - run: python -m unittest discover -s tests -p test_classforkids_calendar.py -v
      - run: python scripts/validate_activity_date_routes.py
        env:
          DRY_RUN: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-date-review-${{ github.run_id }}
          path: activity-date-review/
          if-no-files-found: error
          retention-days: 30
