name: Dadspace news

on:
  # Manual button in the Actions tab. Dry run is ON by default.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run? true = only show results, false = save to database"
        default: "true"

  # Automatic schedule: switched OFF for now.
  # When you're happy with the dry-run results, delete the two "#" below
  # (runs every 3 hours).
  # schedule:
  #   - cron: "15 */3 * * *"

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests feedparser

      - name: Self-test
        run: python news_worker.py --self-test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run news worker
        run: python news_worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Scheduled runs have no button input, so they save for real.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
