name: Dadspace news

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run? true = only show results, false = save to database"
        default: "true"

  workflow_call:
    inputs:
      dry_run:
        description: "Dry run? true = only show results, false = save to database"
        required: false
        type: string
        default: "false"

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests feedparser

      - name: Self-test
        run: python news_worker_locality.py --self-test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run news worker
        run: python news_worker_locality.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
