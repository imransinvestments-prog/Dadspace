name: Dadspace news
run-name: News ${{ github.event_name }} ${{ inputs.maintenance_request || '' }}

on:
  pull_request:
    paths:
      - '.github/workflows/news.yml'
      - 'app/api/region/**'
      - 'components/news/**'
      - 'hooks/use-region-from-location.ts'
      - 'lib/news*.ts'
      - 'lib/distance.ts'
      - 'news*'
      - 'scripts/test*news*'
      - 'tests/test_news_maintenance.py'
      - 'tests/test_maintenance_run.py'
      - 'scripts/maintenance-run.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run? true = only show results, false = save to database"
        default: "true"
      live_smoke_test:
        description: "Run an additional paid Gemini connectivity check"
        type: boolean
        default: false
      source_id:
        description: Optional single active source ID
        default: ''
      max_new:
        description: Candidate cap for manual collection
        default: '10'
      max_minutes:
        description: Time cap for manual collection
        default: '5'
      maintenance_request:
        description: Optional Operations audit request UUID
        default: ''

  workflow_call:
    inputs:
      dry_run:
        description: "Dry run? true = only show results, false = save to database"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pip install requests feedparser googlenewsdecoder==0.2.1 selectolax==0.4.12
      - name: Locality regression checks
        run: |
          node scripts/test-news-locality.mjs
          python scripts/test_news_locality.py
          python -m unittest discover -s tests -p test_news_maintenance.py -v
          python -m unittest discover -s tests -p test_maintenance_run.py -v
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  news:
    needs: checks
    # PR checks use mocks; collection and paid reviews are manual/scheduled only.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dadspace-news-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests feedparser googlenewsdecoder==0.2.1 selectolax==0.4.12

      - name: Explicit paid smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke_test }}
        run: python news_worker_locality.py --self-test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_LOCALITY_REPORT_PATH: news-locality-review.jsonl

      - name: Validate maintenance claim
        run: python scripts/maintenance-run.py start news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAINTENANCE_REQUEST: ${{ inputs.maintenance_request }}
          MAINTENANCE_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAINTENANCE_SOURCE: ${{ inputs.source_id }}
          MAINTENANCE_MAX_NEW: ${{ inputs.max_new }}
          MAINTENANCE_MAX_MINUTES: ${{ inputs.max_minutes }}
      - name: Run news worker
        id: collect
        run: python news_worker_locality.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          NEWS_SOURCE_ID: ${{ inputs.source_id }}
          MAX_NEW_PER_RUN: ${{ inputs.max_new || '300' }}
          MAX_RUN_MINUTES: ${{ inputs.max_minutes || '20' }}
          NEWS_LOCALITY_REPORT_PATH: news-locality-review.jsonl

      - name: Reconcile maintenance result
        if: always()
        run: python scripts/maintenance-run.py finish news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAINTENANCE_REQUEST: ${{ inputs.maintenance_request }}
          MAINTENANCE_RESULT: ${{ job.status }}

      - name: Upload locality review evidence
        if: always() && (github.event_name == 'pull_request' || inputs.dry_run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: news-locality-review
          path: news-locality-review.jsonl
          if-no-files-found: warn
          retention-days: 14

