name: Dadspace news

on:
  pull_request:
    paths:
      - '.github/workflows/news.yml'
      - 'app/api/region/**'
      - 'components/news/**'
      - 'hooks/use-region-from-location.ts'
      - 'lib/news*.ts'
      - 'lib/distance.ts'
      - 'news*'
      - 'scripts/test*news*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run? true = only show results, false = save to database"
        default: "true"
      live_smoke_test:
        description: "Run an additional paid LLM connectivity check"
        type: boolean
        default: false

  workflow_call:
    inputs:
      dry_run:
        description: "Dry run? true = only show results, false = save to database"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pip install -r requirements-llm.txt requests feedparser googlenewsdecoder==0.2.1 selectolax==0.4.12
      - name: Locality regression checks
        run: |
          node scripts/test-news-locality.mjs
          python scripts/test_news_locality.py
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  news:
    needs: checks
    # PR checks use mocks; collection and paid reviews are manual/scheduled only.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements-llm.txt requests feedparser googlenewsdecoder==0.2.1 selectolax==0.4.12

      - name: Explicit paid smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke_test }}
        run: python news_worker_locality.py --self-test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_RUN_MAX_ATTEMPTS: ${{ vars.LLM_RUN_MAX_ATTEMPTS }}
          LLM_RUN_TOKEN_BUDGET: ${{ vars.LLM_RUN_TOKEN_BUDGET }}
          LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES }}
          LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_MAX_OUTPUT_TOKENS }}
          EXTRACTION_LLM_PROVIDER: ${{ vars.EXTRACTION_LLM_PROVIDER }}
          EXTRACTION_LLM_MODEL: ${{ vars.EXTRACTION_LLM_MODEL }}
          NEWS_LLM_PROVIDER: ${{ vars.NEWS_LLM_PROVIDER }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
          ORIGINAL_CONTENT_LLM_PROVIDER: ${{ vars.ORIGINAL_CONTENT_LLM_PROVIDER }}
          ORIGINAL_CONTENT_LLM_MODEL: ${{ vars.ORIGINAL_CONTENT_LLM_MODEL }}
          NEWS_LOCALITY_REPORT_PATH: news-locality-review.jsonl

      - name: Run news worker
        run: python news_worker_locality.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_RUN_MAX_ATTEMPTS: ${{ vars.LLM_RUN_MAX_ATTEMPTS }}
          LLM_RUN_TOKEN_BUDGET: ${{ vars.LLM_RUN_TOKEN_BUDGET }}
          LLM_MAX_RETRIES: ${{ vars.LLM_MAX_RETRIES }}
          LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_MAX_OUTPUT_TOKENS }}
          EXTRACTION_LLM_PROVIDER: ${{ vars.EXTRACTION_LLM_PROVIDER }}
          EXTRACTION_LLM_MODEL: ${{ vars.EXTRACTION_LLM_MODEL }}
          NEWS_LLM_PROVIDER: ${{ vars.NEWS_LLM_PROVIDER }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
          ORIGINAL_CONTENT_LLM_PROVIDER: ${{ vars.ORIGINAL_CONTENT_LLM_PROVIDER }}
          ORIGINAL_CONTENT_LLM_MODEL: ${{ vars.ORIGINAL_CONTENT_LLM_MODEL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_NEW_PER_RUN: ${{ github.event_name == 'pull_request' && '40' || '300' }}
          MAX_RUN_MINUTES: ${{ github.event_name == 'pull_request' && '8' || '20' }}
          NEWS_LOCALITY_REPORT_PATH: news-locality-review.jsonl

      - name: Upload locality review evidence
        if: always() && (github.event_name == 'pull_request' || inputs.dry_run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: news-locality-review
          path: news-locality-review.jsonl
          if-no-files-found: warn
          retention-days: 14

