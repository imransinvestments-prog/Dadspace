name: NCT markup probe
on:
  push:
    branches: [main]
    paths: ["nct_probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python nct_probe.py
